name: ci

on:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NPM_PACKAGE_NAME: phenoml

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install

      - name: Compile
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm test

  release_precheck:
    needs: [compile, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_release_gate: ${{ steps.check.outputs.run_release_gate }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Check whether release gate should run
        id: check
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          version=$(jq -r '.version // empty' package.json)
          if [ -z "$version" ]; then
            echo "::error::Could not read SDK version from package.json."
            exit 1
          fi

          target_commit=$(git rev-parse --verify "HEAD^{commit}")
          existing_commit=$(git rev-parse -q --verify "refs/tags/${version}^{commit}" || true)
          if [ -n "$existing_commit" ] && [ "$existing_commit" != "$target_commit" ]; then
            echo "Tag $version already points at $existing_commit, not $target_commit; skipping release gate for this non-release commit."
            echo "run_release_gate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_release_gate=true" >> "$GITHUB_OUTPUT"

  build-artifact:
    needs: [compile, test, release_precheck]
    if: github.ref == 'refs/heads/main' && needs.release_precheck.outputs.run_release_gate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Pack tarball and checksum
        run: |
          mkdir -p artifact
          npm pack --pack-destination artifact
          (cd artifact && sha256sum ./*.tgz > SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: artifact
          if-no-files-found: error
          retention-days: 7

  release_gate:
    needs: [compile, test, release_precheck, build-artifact]
    if: github.ref == 'refs/heads/main' && needs.release_precheck.outputs.run_release_gate == 'true'
    permissions:
      contents: read
    uses: PhenoML/sdk-shared-actions/.github/workflows/sdk-release-gate.yml@1.2.0
    with:
      version-source: package-json
      version-path: package.json
      spec-path: openapi/openapi.json

  publish:
    needs: [compile, test, build-artifact, release_gate]
    if: needs.release_gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.verify.outputs.published }}

    steps:
      # Node 24 ships npm >= 11.5, which supports OIDC Trusted Publishing
      # without npx -y npm@latest (avoids running install scripts in the
      # same job as the OIDC credential).
      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact

      - name: Verify checksum
        working-directory: artifact
        run: sha256sum -c SHA256SUMS

      - name: Publish to npm
        working-directory: artifact
        run: |
          set -euo pipefail
          TARBALL=$(find . -maxdepth 1 -name '*.tgz' -print -quit)
          # Match the version, not the tarball filename: the filename also
          # carries the package name, which could spuriously contain
          # alpha/beta. The tarball's own package.json is authoritative for
          # the version being published.
          VERSION=$(tar -xzOf "$TARBALL" package/package.json | jq -r .version)
          NAME=$(tar -xzOf "$TARBALL" package/package.json | jq -r .name)
          case "$VERSION" in
            *alpha*) TAG=alpha ;;
            *beta*)  TAG=beta ;;
            *)       TAG=latest ;;
          esac
          if npm publish --access public --tag "$TAG" "$TARBALL"; then
            exit 0
          else
            status=$?
          fi

          published_version=$(npm view "${NAME}@${VERSION}" version --registry "https://registry.npmjs.org" 2>/dev/null || true)
          if [ "$published_version" = "$VERSION" ]; then
            echo "${NAME}@${VERSION} is already available on npm; continuing to finalization."
            exit 0
          fi
          exit "$status"

      - name: Verify npm version availability
        id: verify
        env:
          VERSION: ${{ needs.release_gate.outputs.version }}
        run: |
          set -euo pipefail
          published_version=$(npm view "${NPM_PACKAGE_NAME}@${VERSION}" version --registry "https://registry.npmjs.org" 2>/dev/null || true)
          if [ "$published_version" != "$VERSION" ]; then
            echo "::error::${NPM_PACKAGE_NAME}@${VERSION} is not available on npm."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

  confirm_registry_release:
    needs: [release_gate]
    if: github.ref == 'refs/heads/main' && needs.release_gate.outputs.should_publish == 'false'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.verify.outputs.published }}

    steps:
      - name: Verify npm version availability
        id: verify
        env:
          VERSION: ${{ needs.release_gate.outputs.version }}
        run: |
          set -euo pipefail
          published_version=$(npm view "${NPM_PACKAGE_NAME}@${VERSION}" version --registry "https://registry.npmjs.org" 2>/dev/null || true)
          if [ "$published_version" != "$VERSION" ]; then
            echo "::error::${NPM_PACKAGE_NAME}@${VERSION} is not available on npm."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

  release_finalize:
    needs: [release_gate, publish, confirm_registry_release]
    if: always() && needs.release_gate.result == 'success' && (needs.publish.outputs.published == 'true' || needs.confirm_registry_release.outputs.published == 'true')
    permissions:
      contents: write
    uses: PhenoML/sdk-shared-actions/.github/workflows/sdk-release-finalize.yml@1.2.0
    with:
      version-tag: ${{ needs.release_gate.outputs.version_tag }}
      origin-commit: ${{ needs.release_gate.outputs.origin_commit }}
      origin-tag: ${{ needs.release_gate.outputs.origin_tag }}
